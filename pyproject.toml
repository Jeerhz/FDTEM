[tool.poetry]
name = "fdtem"
version = "0.1.0"
description = "Length and domain sensitivity of learned MT metrics (COMET)"
authors = ["Adle Ben Salem"]
readme = "README.md"
license = "Apache-2.0"
packages = [
    {include = "common"},
    {include = "part1_block_alignment"},
    {include = "part2_length_training"},
    {include = "part3_biomed_finetune"},
]

[tool.poetry.dependencies]
python = ">=3.10"
unbabel-comet = "2.2.7"
pydantic = ">=2.6,<3"
pandas = ">=1.4"
numpy = ">=1.20"
scipy = ">=1.5"
matplotlib = ">=3.7"
datasets = ">=2.14"
huggingface-hub = ">=0.19.3,<1.0"
wandb = ">=0.27"
pyyaml = ">=6.0"
tqdm = ">=4.60"
spacy = {version = ">=3.7", optional = true}
nltk = {version = ">=3.8", optional = true}

[tool.poetry.extras]
spacy = ["spacy", "nltk"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
