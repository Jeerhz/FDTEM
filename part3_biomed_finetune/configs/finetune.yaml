# Fine-tuning of Unbabel/wmt22-comet-da (RegressionMetric, XLM-R large) on Bio-MQM.
# The data paths below are placeholders: slurm/finetune.sh overrides them through
# common.train_comet --train_files / --val_files (one train file: COMET reads only train_data[0]).

regression_metric:
  class_path: comet.models.RegressionMetric
  init_args:
    encoder_model: XLM-RoBERTa
    pretrained_model: xlm-roberta-large

    pool: avg
    layer: mix
    layer_transformation: sparsemax
    layer_norm: False

    hidden_sizes:
      - 3072
      - 1024
    activations: Tanh
    final_activation: null
    dropout: 0.1
    loss: mse

    # Conservative domain adaptation: encoder frozen for the first 30 % of the
    # first epoch, then a low encoder LR to limit forgetting.
    nr_frozen_epochs: 0.3
    keep_embeddings_frozen: False
    optimizer: AdamW
    encoder_learning_rate: 5.0e-07
    learning_rate: 1.0e-05
    layerwise_decay: 0.95
    warmup_steps: 100

    batch_size: 8   # reduce if OOM; compensate with accumulate_grad_batches

    train_data:
      - ~/scratch/bio_mqm/all_train.csv
    validation_data:
      - ~/scratch/bio_mqm/all_val.csv

trainer: common/configs/trainer_wandb.yaml
early_stopping: common/configs/early_stopping.yaml
model_checkpoint: common/configs/model_checkpoint.yaml
