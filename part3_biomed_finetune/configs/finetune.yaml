# ──────────────────────────────────────────────────────────────────────────────
# COMET finetuning config — Amazon Bio-MQM
#
# Finetunes wmt22-comet-da (RegressionMetric / XLM-R-large) on biomedical
# MQM data produced by scripts/prepare_bio_mqm_data.py.
#
# Usage:
#   comet-train --cfg configs/models/bio_mqm_finetune.yaml \
#               --load_from_checkpoint <path/to/wmt22-comet-da/checkpoints/model.ckpt>
#
# The checkpoint path above can be obtained with:
#   python -c "from comet import download_model; print(download_model('Unbabel/wmt22-comet-da'))"
# ──────────────────────────────────────────────────────────────────────────────

regression_metric:
  class_path: comet.models.RegressionMetric
  init_args:
    # ── encoder ───────────────────────────────────────────────────────────────
    encoder_model: XLM-RoBERTa
    pretrained_model: xlm-roberta-large

    # ── layer pooling ─────────────────────────────────────────────────────────
    pool: avg
    layer: mix
    layer_transformation: sparsemax
    layer_norm: False

    # ── top-layer regression head ─────────────────────────────────────────────
    hidden_sizes:
      - 3072
      - 1024
    activations: Tanh
    final_activation: null
    dropout: 0.1
    loss: mse

    # ── learning rates (conservative for domain adaptation) ───────────────────
    # Keep the encoder mostly frozen for the first 30 % of each epoch,
    # then unfreeze with a low LR to avoid catastrophic forgetting.
    nr_frozen_epochs: 0.3
    keep_embeddings_frozen: False
    optimizer: AdamW
    encoder_learning_rate: 5.0e-07   # encoder LR — lower than default
    learning_rate: 1.0e-05           # regression head LR
    layerwise_decay: 0.95
    warmup_steps: 100

    # ── batch ─────────────────────────────────────────────────────────────────
    batch_size: 8   # reduce if OOM; compensate with accumulate_grad_batches

    # ── data (generated by scripts/prepare_bio_mqm_data.py) ──────────────────
    # Replace / extend these paths after running prepare_bio_mqm_data.py.
    # One file per language pair keeps per-LP validation metrics visible in W&B.
    train_data:
      - ~/scratch/bio_mqm/en-de_train.csv
      - ~/scratch/bio_mqm/de-en_train.csv
      - ~/scratch/bio_mqm/en-es_train.csv
      - ~/scratch/bio_mqm/es-en_train.csv
      - ~/scratch/bio_mqm/en-fr_train.csv
      - ~/scratch/bio_mqm/fr-en_train.csv
      - ~/scratch/bio_mqm/en-ru_train.csv
      - ~/scratch/bio_mqm/ru-en_train.csv
      - ~/scratch/bio_mqm/en-zh_train.csv
      - ~/scratch/bio_mqm/zh-en_train.csv
    validation_data:
      - ~/scratch/bio_mqm/en-de_val.csv
      - ~/scratch/bio_mqm/de-en_val.csv
      - ~/scratch/bio_mqm/en-es_val.csv
      - ~/scratch/bio_mqm/es-en_val.csv
      - ~/scratch/bio_mqm/en-fr_val.csv
      - ~/scratch/bio_mqm/fr-en_val.csv
      - ~/scratch/bio_mqm/en-ru_val.csv
      - ~/scratch/bio_mqm/ru-en_val.csv
      - ~/scratch/bio_mqm/en-zh_val.csv
      - ~/scratch/bio_mqm/zh-en_val.csv

trainer: ../../../configs/trainer_wandb.yaml
early_stopping: ../../../configs/early_stopping.yaml
model_checkpoint: ../../../configs/model_checkpoint.yaml
