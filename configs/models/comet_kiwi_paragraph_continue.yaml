# ──────────────────────────────────────────────────────────────────────────────
# CometKiwi (QE, reference-free) continued training on PARAGRAPH-LEVEL data.
#
# Mirror of comet_paragraph_continue.yaml for the QE base model
# Unbabel/wmt22-cometkiwi-da (UnifiedMetric, infoxlm-large, inputs mt+src).
# Same conservative continue-training schedule as the DA arms so the
# sentence-fraction sweep is comparable across base metrics.
#
# NOTE layer_transformation: the released kiwi hparams say `sparsemax_patch`,
# which comet ≥ 2.2.4 resolves to SOFTMAX at load time (upstream issue #244).
# We therefore continue with `softmax` — the transformation the weights were
# actually trained with — NOT sparsemax.
#
# Usage:
#   BASE=$(python -c "from comet import download_model; print(download_model('Unbabel/wmt22-cometkiwi-da'))")
#   python scripts/train_wandb.py --cfg configs/models/comet_kiwi_paragraph_continue.yaml \
#                                 --load_from_checkpoint "$BASE"
#
# License note: wmt22-cometkiwi-da is CC-BY-NC-SA-4.0 — any published
# fine-tune of it must carry the same license (non-commercial, share-alike).
# ──────────────────────────────────────────────────────────────────────────────

unified_metric:
  class_path: comet.models.UnifiedMetric
  init_args:
    # ── encoder (kiwi's own backbone — unchanged, this arm isolates DATA) ─────
    encoder_model: XLM-RoBERTa
    pretrained_model: microsoft/infoxlm-large

    # ── architecture (mirrors wmt22-cometkiwi-da hparams) ─────────────────────
    sent_layer: mix
    layer_transformation: softmax   # == kiwi's `sparsemax_patch` at runtime
    layer_norm: false
    word_layer: 24
    word_level_training: false
    loss_lambda: 0.65
    hidden_sizes:
      - 3072
      - 1024
    activations: Tanh
    final_activation: null
    dropout: 0.1
    loss: mse
    input_segments:
      - mt
      - src

    # ── learning rates (same continue-training schedule as the DA arms) ───────
    nr_frozen_epochs: 0.3
    keep_embeddings_frozen: true    # kiwi convention
    optimizer: AdamW
    encoder_learning_rate: 5.0e-07
    learning_rate: 1.0e-05
    layerwise_decay: 0.95
    warmup_steps: 100

    # ── batch (inputs are up to ~480 tokens — 4×8 accum = effective 32) ────────
    batch_size: 4

    # ── data (same CSVs as the DA arms; `ref` column present but unused) ───────
    train_data:
      - ~/scratch/paragraph_mqm/en-de_train.csv
      - ~/scratch/paragraph_mqm/de-en_train.csv
      - ~/scratch/paragraph_mqm/en-es_train.csv
      - ~/scratch/paragraph_mqm/es-en_train.csv
      - ~/scratch/paragraph_mqm/en-fr_train.csv
      - ~/scratch/paragraph_mqm/fr-en_train.csv
      - ~/scratch/paragraph_mqm/en-ru_train.csv
      - ~/scratch/paragraph_mqm/ru-en_train.csv
    validation_data:
      - ~/scratch/paragraph_mqm/en-de_val.csv
      - ~/scratch/paragraph_mqm/de-en_val.csv
      - ~/scratch/paragraph_mqm/en-es_val.csv
      - ~/scratch/paragraph_mqm/es-en_val.csv
      - ~/scratch/paragraph_mqm/en-fr_val.csv
      - ~/scratch/paragraph_mqm/fr-en_val.csv
      - ~/scratch/paragraph_mqm/en-ru_val.csv
      - ~/scratch/paragraph_mqm/ru-en_val.csv

trainer: ../trainer_wandb.yaml
early_stopping: ../early_stopping.yaml
model_checkpoint: ../model_checkpoint.yaml
