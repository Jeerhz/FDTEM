# ──────────────────────────────────────────────────────────────────────────────
# COMET continued training on PARAGRAPH-LEVEL data (length-balanced mix).
#
# Question: does continuing wmt22-comet-da on longer, multi-sentence segments
# make its scores correlate better with quality on long text?
#
# Data: length-balanced windows (k = 1,2,3,4,6 consecutive Bio-MQM segments,
# equal count per k) built by scripts/prepare_paragraph_data.py. k=1 keeps the
# sentence-level signal, so short-segment performance is not sacrificed.
#
# Usage (continue from the public checkpoint):
#   BASE=$(python -c "from comet import download_model; print(download_model('Unbabel/wmt22-comet-da'))")
#   python scripts/train_wandb.py --cfg configs/models/comet_paragraph_continue.yaml \
#                                 --load_from_checkpoint "$BASE"
#
# Compare against: the sentence-level-only bio ckpt
# (~/scratch/checkpoints/bio_mqm/comet-bio-mqm/4yeqp7cn/checkpoints/last.ckpt)
# with scripts/eval_length_correlation.py.
# ──────────────────────────────────────────────────────────────────────────────

regression_metric:
  class_path: comet.models.RegressionMetric
  init_args:
    # ── encoder (unchanged — this arm isolates the DATA effect) ───────────────
    encoder_model: XLM-RoBERTa
    pretrained_model: xlm-roberta-large

    # ── layer pooling ─────────────────────────────────────────────────────────
    pool: avg
    layer: mix
    layer_transformation: sparsemax
    layer_norm: False

    # ── top-layer regression head ─────────────────────────────────────────────
    hidden_sizes:
      - 3072
      - 1024
    activations: Tanh
    final_activation: null
    dropout: 0.1
    loss: mse

    # ── learning rates (conservative: continued training, avoid forgetting) ───
    nr_frozen_epochs: 0.3
    keep_embeddings_frozen: False
    optimizer: AdamW
    encoder_learning_rate: 5.0e-07
    learning_rate: 1.0e-05
    layerwise_decay: 0.95
    warmup_steps: 100

    # ── batch (inputs are up to ~480 tokens — 4×8 accum = effective 32) ────────
    batch_size: 4

    # ── data (generated by scripts/prepare_paragraph_data.py) ──────────────────
    train_data:
      - ~/scratch/paragraph_mqm/en-de_train.csv
      - ~/scratch/paragraph_mqm/de-en_train.csv
      - ~/scratch/paragraph_mqm/en-es_train.csv
      - ~/scratch/paragraph_mqm/es-en_train.csv
      - ~/scratch/paragraph_mqm/en-fr_train.csv
      - ~/scratch/paragraph_mqm/fr-en_train.csv
      - ~/scratch/paragraph_mqm/en-ru_train.csv
      - ~/scratch/paragraph_mqm/ru-en_train.csv
    validation_data:
      - ~/scratch/paragraph_mqm/en-de_val.csv
      - ~/scratch/paragraph_mqm/de-en_val.csv
      - ~/scratch/paragraph_mqm/en-es_val.csv
      - ~/scratch/paragraph_mqm/es-en_val.csv
      - ~/scratch/paragraph_mqm/en-fr_val.csv
      - ~/scratch/paragraph_mqm/fr-en_val.csv
      - ~/scratch/paragraph_mqm/en-ru_val.csv
      - ~/scratch/paragraph_mqm/ru-en_val.csv

trainer: ../trainer_wandb.yaml
early_stopping: ../early_stopping.yaml
model_checkpoint: ../model_checkpoint.yaml
